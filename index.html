<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1B2C">
<title>Plateforme de convoyage · Démo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --nuit:#0E1B2C;--nuit2:#16273D;--nuit3:#20354F;--fond:#F3F5F8;--carte:#fff;--ligne:#E4E8EE;--texte:#152235;--doux:#66748A;--pale:#9AA6B6;
  --orange:#FF6A1A;--orange2:#FFF0E7;--vert:#14A06A;--vert2:#E4F6EE;--bleu:#2F6FED;--bleu2:#E8EFFE;--jaune:#F2A900;--jaune2:#FFF6DC;--rouge:#E0433A;--rouge2:#FDECEA;--violet:#7A5AF0;--violet2:#EFEBFE;
  --f-t:'Sora',system-ui,sans-serif;--f-b:'Inter',system-ui,-apple-system,sans-serif;--r:16px;--sh:0 1px 2px rgba(14,27,44,.05),0 8px 24px rgba(14,27,44,.06)
}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fond);color:var(--texte);font:400 15px/1.45 var(--f-b);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-t);margin:0;letter-spacing:-.02em;line-height:1.15}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}.muted{color:var(--doux)}.small{font-size:13px}.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
/* Bandeau démo */
.demo-bar{position:sticky;top:0;z-index:60;background:#0A1422;color:#C9D4E3;display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:13px;flex-wrap:wrap}
.demo-bar b{color:#fff}.demo-bar .sw{display:flex;background:#16273D;border-radius:10px;padding:3px;gap:3px;margin-left:auto}
.demo-bar .sw a{padding:6px 12px;border-radius:8px;text-decoration:none;color:#AFC0D6;font-weight:600;white-space:nowrap}
.demo-bar .sw a.on{background:var(--orange);color:#fff}
.demo-bar .reset{background:none;border:1px solid #2B4262;color:#AFC0D6;border-radius:8px;padding:5px 10px;cursor:pointer}
/* Bureau */
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 44px)}
.side{background:var(--nuit);color:#C9D4E3;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:44px;height:calc(100vh - 44px)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.logo .m{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--orange),#FF9A4D);display:grid;place-items:center;color:#fff}
.logo .m svg{width:22px;height:22px}
.logo b{display:block;color:#fff;font:700 16px var(--f-t);letter-spacing:-.01em}.logo span{font-size:11.5px;color:#7F92AB;letter-spacing:.06em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#B7C5D8;font-weight:500}
.nav a:hover{background:var(--nuit2)}.nav a.on{background:var(--nuit3);color:#fff}.nav a.on svg{color:var(--orange)}
.nav svg{width:19px;height:19px;flex:none}.nav .pip{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--nuit3)}
main.bureau{padding:26px clamp(16px,3vw,36px) 60px;max-width:1320px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:5px 0 0;color:var(--doux)}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--nuit);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#9FB1C8;text-decoration:none;padding:4px 0}
  .tabbar a.on{color:#fff}.tabbar a.on svg{color:var(--orange)}.tabbar svg{width:21px;height:21px}
  main.bureau{padding-bottom:100px}
}
/* Composants */
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:2fr 1fr}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
.bureau,.grid>*{min-width:0}
.kpi .l{font-size:12.5px;color:var(--doux);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:700 28px var(--f-t);margin:6px 0 2px;letter-spacing:-.03em}.kpi .s{font-size:12.5px;color:var(--doux)}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;float:right}.kpi .ic svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:0;background:var(--nuit);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.or{background:var(--orange)}.btn.gh{background:#fff;color:var(--texte);border:1px solid var(--ligne)}.btn.vert{background:var(--vert)}.btn.rouge{background:var(--rouge)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:9px}.btn.bl{width:100%}.btn svg{width:17px;height:17px}.btn[disabled]{opacity:.45;cursor:default}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.st-a_planifier{background:#EEF1F5;color:#5B6B80}.st-planifiee{background:var(--bleu2);color:var(--bleu)}.st-en_route{background:var(--violet2);color:var(--violet)}
.st-pris_en_charge,.st-en_convoi{background:var(--orange2);color:#D9540D}.st-livree{background:var(--vert2);color:var(--vert)}.st-facturee{background:#E9ECF1;color:#3B4A5E}
.tag.alerte{background:var(--rouge2);color:var(--rouge)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--doux);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--ligne);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--ligne);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}tbody tr:hover{background:#F8FAFC}
.tw{overflow-x:auto}
.trajet{display:flex;flex-direction:column;gap:2px;font-size:13.5px}.trajet .a,.trajet .b{display:flex;align-items:center;gap:7px}
.trajet .a:before,.trajet .b:before{content:'';width:8px;height:8px;border-radius:50%;flex:none}
.trajet .a:before{background:var(--bleu)}.trajet .b:before{background:var(--orange)}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ligne);background:#fff;border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.input,select.input,textarea.input{width:100%;min-height:44px;border:1px solid var(--ligne);border-radius:11px;padding:10px 12px;background:#fff;font-size:15px}
textarea.input{min-height:80px}
.input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,26,.15)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--doux)}
.form{display:grid;gap:14px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#map,.map{height:520px;border-radius:var(--r);overflow:hidden;border:1px solid var(--ligne)}
.map.sm{height:280px}
.leaflet-container{font-family:var(--f-b)}
.pinv{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:grid;place-items:center;color:#fff;font:700 12px var(--f-b)}
/* Panneau latéral */
.voile{position:fixed;inset:0;background:rgba(10,20,34,.4);z-index:70}
.panneau{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--fond);z-index:71;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2);animation:glisse .25s ease}
@keyframes glisse{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.panneau .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--ligne);padding:16px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.panneau .pc{padding:18px 20px 40px;display:grid;gap:14px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--ligne);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.x svg{width:18px;height:18px}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;padding:0 0 14px;position:relative}
.tl li:before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--ligne)}.tl li:last-child:before{display:none}
.tl .d{width:24px;height:24px;border-radius:50%;background:#E6EAF0;display:grid;place-items:center;flex:none;color:#fff}.tl .d svg{width:13px;height:13px}
.tl li.ok .d{background:var(--vert)}.tl li.cur .d{background:var(--orange);box-shadow:0 0 0 5px var(--orange2)}
.tl .t{font-weight:600}.tl .s{font-size:12.5px;color:var(--doux)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.photos .p{aspect-ratio:4/3;border-radius:10px;background:#EEF1F5 center/cover;display:grid;place-items:center;font-size:11px;color:var(--doux);text-align:center;padding:4px;position:relative;overflow:hidden}
.photos .p span{position:absolute;left:4px;bottom:4px;background:rgba(14,27,44,.7);color:#fff;border-radius:6px;padding:1px 6px;font-size:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv dt{color:var(--doux)}.kv dd{margin:0;font-weight:600;text-align:right}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--nuit);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;animation:monte .25s ease}
@keyframes monte{from{transform:translate(-50%,10px);opacity:0}}
.plan{display:grid;grid-template-columns:150px repeat(14,1fr);font-size:12px;min-width:900px}
.plan .h{color:var(--doux);font-weight:600;padding:6px 0;border-bottom:1px solid var(--ligne);text-align:center}
.plan .n{padding:10px 8px;border-bottom:1px solid var(--ligne);display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.plan .c{border-bottom:1px solid var(--ligne);border-left:1px dashed #EEF1F5;position:relative;min-height:52px}
.plan .bloc{position:absolute;top:8px;bottom:8px;border-radius:8px;padding:4px 7px;color:#fff;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:1;font-size:11.5px;line-height:1.25}
/* Facture / PV impression */
.doc{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:28px;font-size:13.5px}
.doc h2{font-size:22px}.doc table td,.doc table th{padding:8px 6px}
@media print{.demo-bar,.side,.tabbar,.noprint,.voile{display:none!important}.panneau{position:static;width:100%;box-shadow:none}.app{display:block}body{background:#fff}}
/* ===== App convoyeur ===== */
.tel-wrap{display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:30px 16px 60px;flex-wrap:wrap}
.tel{width:390px;height:800px;border-radius:52px;background:#0A1422;padding:12px;box-shadow:0 30px 80px rgba(14,27,44,.35);flex:none}
.ecran{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#F5F6F9;position:relative;display:flex;flex-direction:column}
.tel-note{max-width:340px}.tel-note h2{margin-bottom:10px}.tel-note li{margin-bottom:8px}
@media (max-width:640px){.tel-wrap{padding:0;display:block}.tel{width:100%;height:calc(100vh - 44px);border-radius:0;padding:0;box-shadow:none}.ecran{border-radius:0}.tel-note{display:none}}
.m-top{background:var(--nuit);color:#fff;padding:44px 18px 16px;flex:none}
@media (max-width:640px){.m-top{padding-top:16px}}
.m-top h2{color:#fff;font-size:21px}.m-top .s{color:#9FB1C8;font-size:13px;margin-top:3px}
.m-body{flex:1;overflow:auto;padding:14px 14px 90px}
.m-card{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid var(--ligne)}
.m-btn{width:100%;min-height:56px;border-radius:15px;border:0;background:var(--orange);color:#fff;font:700 16px var(--f-b);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.m-btn.vert{background:var(--vert)}.m-btn.gh{background:#fff;color:var(--texte);border:1px solid var(--ligne)}.m-btn svg{width:20px;height:20px}
.m-bas{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#F5F6F9 30%)}
.etapes{display:flex;gap:4px;margin:12px 0 2px}.etapes i{flex:1;height:5px;border-radius:3px;background:#2B4262}.etapes i.on{background:var(--orange)}
.voiture{width:100%;max-width:240px;display:block;margin:0 auto}
.voiture .z{fill:#EEF1F5;stroke:#B9C3D1;stroke-width:1.5;cursor:pointer;transition:fill .15s}
.voiture .z:hover{fill:#FFE3D2}.voiture .z.dmg{fill:#FF8F7A;stroke:var(--rouge)}
.voiture .vitre{fill:#D6E2F1;stroke:#9DB0C8;pointer-events:none}
.ph-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ph-grid label{aspect-ratio:1;border-radius:12px;border:1.5px dashed #C3CCD8;display:grid;place-items:center;text-align:center;font-size:10px;color:var(--doux);cursor:pointer;background:#fff center/cover;position:relative;line-height:1.2;padding:3px}
.ph-grid label.ok{border:0}.ph-grid label.ok span{position:absolute;bottom:3px;left:3px;right:3px;background:rgba(14,27,44,.7);color:#fff;border-radius:5px;font-size:9px}
.ph-grid label svg{width:20px;height:20px;display:block;margin:0 auto 2px;color:var(--orange)}
.fuel{display:flex;gap:3px}.fuel button{flex:1;height:30px;border:0;border-radius:5px;background:#E6EAF0;cursor:pointer}.fuel button.on{background:var(--vert)}
canvas.sig{width:100%;height:150px;background:#fff;border:1.5px dashed #C3CCD8;border-radius:12px;touch-action:none;display:block}
.m-list .mi{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border:1px solid var(--ligne)}
.m-list .h{font:700 15px var(--f-t);min-width:50px;text-align:center;color:var(--nuit)}
/* ===== Suivi client ===== */
.suivi{max-width:720px;margin:0 auto;padding:24px 16px 60px}
.suivi .hero{background:var(--nuit);color:#fff;border-radius:22px;padding:24px;margin-bottom:14px;position:relative;overflow:hidden}
.suivi .hero:after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,26,.45),transparent 70%)}
.suivi .hero h1{color:#fff}.suivi .hero p{color:#B7C5D8;margin:6px 0 0}
.prog-s{display:flex;gap:6px;margin-top:18px}.prog-s div{flex:1}.prog-s i{display:block;height:6px;border-radius:3px;background:#2B4262}.prog-s .on i{background:var(--orange)}.prog-s span{display:block;font-size:11px;color:#9FB1C8;margin-top:6px}

/* Correctifs responsive & superpositions */
:root{--barre:44px}
.demo-bar{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));min-height:var(--barre);box-sizing:border-box;flex-wrap:nowrap}
.demo-bar .lib{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#map,.map{position:relative;z-index:0;isolation:isolate}
.leaflet-container{background:#E3E9F0;font:inherit}
.panneau{padding-top:env(safe-area-inset-top,0px)}
.kpi b{font-size:clamp(21px,2.4vw,28px);white-space:nowrap}
.side{top:var(--barre);height:calc(100vh - var(--barre))}
.tel{height:min(800px,calc(100vh - var(--barre) - 50px));min-height:600px}
.toast{z-index:120;bottom:calc(28px + env(safe-area-inset-bottom,0px))}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}main.bureau{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}}
@media (max-width:760px){.demo-bar .fx,.demo-bar .lg{display:none}.demo-bar{gap:8px;font-size:12.5px}.demo-bar .sw a{padding:6px 9px}.demo-bar .reset{padding:5px 9px}}
@media (max-width:430px){.demo-bar .lib{display:none}.demo-bar .sw{margin-left:0;flex:1}.demo-bar .sw a{flex:1;text-align:center;padding:7px 4px}}
@media (max-width:640px){
 .tel-wrap{padding:0}.tel{height:auto;min-height:0;width:100%}
 .ecran{overflow:visible;height:auto;min-height:calc(100vh - var(--barre))}
 .m-body{overflow:visible;padding-bottom:20px}
 .m-bas{position:sticky;bottom:0;z-index:5}
}
@media (max-width:480px){.f2{grid-template-columns:1fr!important}.photos{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="demo-bar"><span class="lib">🚗 <b>Démo</b> préparée pour <b id="pour">Ibrahim</b><span class="fx"> · données fictives</span></span>
  <div class="sw"><a href="#/" data-mode="bureau">💻 Bureau</a><a href="#/convoyeur" data-mode="convoyeur">📱 <span class="lg">App </span>Convoyeur</a><a href="#/suivi" data-mode="suivi">🔗 Suivi<span class="lg"> client</span></a></div>
  <button class="reset" id="reset" title="Réinitialiser la démo" aria-label="Réinitialiser la démo">↺<span class="lg"> Réinitialiser</span></button></div>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
